name: Lint and Format

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

jobs:
  lint-and-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: |
          npm run lint || {
            echo "::error title=ESLint Failed::ESLint check failed. Please run 'npm run lint:fix' locally to automatically fix linting errors."
            exit 1
          }

      - name: Run Prettier
        run: |
          npm run format:check || {
            echo "::error title=Prettier Failed::Prettier formatting check failed. Please run 'npm run format' locally to format your files."
            exit 1
          }
